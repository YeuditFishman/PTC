name: CI

on:
  push:
    branches:
      - feature/ptc
  pull_request:
    branches:
      - feature/ptc

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip --trusted-host pypi.org --trusted-host files.pythonhosted.org
          pip install --trusted-host pypi.org --trusted-host files.pythonhosted.org -r backend/requirements.txt
          pip install --trusted-host pypi.org --trusted-host files.pythonhosted.org flake8 ruff pytest pytest-mock

      - name: Run backend linters
        run: |
          echo "--- Running backend linters ---"
          flake8 backend/app backend/tests || true
          ruff check backend/app backend/tests || true

      - name: Run backend tests
        run: |
          echo "--- Running backend tests ---"
          export PYTHONPATH=$PYTHONPATH:/app/backend
          pytest -v backend/tests/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (frontend)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: |
          python -m pip install --upgrade pip --trusted-host pypi.org --trusted-host files.pythonhosted.org
          pip install --trusted-host pypi.org --trusted-host files.pythonhosted.org -r frontend/requirements.txt
          pip install --trusted-host pypi.org --trusted-host files.pythonhosted.org flake8 ruff pytest pytest-mock

      - name: Run frontend linters
        run: |
          echo "--- Running frontend linters ---"
          flake8 frontend/app frontend/tests || true
          ruff check frontend/app frontend/tests || true

      - name: Run frontend tests
        run: |
          echo "--- Running frontend tests ---"
          export PYTHONPATH=$PYTHONPATH:/app/frontend
          pytest -v frontend/tests/
