name: CI

on:
  push:
    branches:
      - feature/ptc
  pull_request:
    branches:
      - feature/ptc

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ptc-backend .

      - name: Run linters (ruff + flake8)
        run: |
          echo "::group::Running ruff"
          docker run --rm ptc-backend ruff app tests
          echo "::endgroup::"

          echo "::group::Running flake8"
          docker run --rm ptc-backend flake8 app tests
          echo "::endgroup::"

      - name: Run tests
        run: |
          echo "::group::Running pytest"
          docker run --rm ptc-backend pytest -v
          echo "::endgroup::"
