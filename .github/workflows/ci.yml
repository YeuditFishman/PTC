name: CI

on:
  push:
    branches:
      - feature/ptc
  pull_request:
    branches:
      - feature/ptc

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ptc-backend ./backend

      - name: Run linters (ruff + flake8)
        run: |
          docker run --rm ptc-backend ruff app tests
          docker run --rm ptc-backend flake8 app tests

      - name: Run tests
        run: docker run --rm ptc-backend pytest -v tests/
